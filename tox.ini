[tox]
env_list = bench, profile
requires = tox>=4.11

[testenv]
description = Build Runome in release mode before executing commands
deps =
    maturin>=1.9.1
    janome==0.5.0
commands_pre =
    maturin develop --release
setenv =
    PYTHONUTF8 = 1
passenv =
    CARGO_TARGET_DIR
    RUSTFLAGS
    RUNOME_*
allowlist_externals =
    cargo

[testenv:bench]
description = Run Runome vs Janome benchmark with consistent settings
commands =
    python -m runome.bench --iterations {env:RUNOME_BENCH_ITERATIONS:300} --warmup {env:RUNOME_BENCH_WARMUP:10} {posargs}
    cargo bench --profile release --bench tokenize -- {env:RUNOME_BENCH_RUST_CRITERION_FLAGS:--measurement-time 1 --warm-up-time 0.5 --sample-size 12}

[testenv:profile]
description = Capture cProfile stats for Runome and Janome tokenizers
commands =
    python -m runome.profile --repeat {env:RUNOME_PROFILE_REPEAT:20} --limit {env:RUNOME_PROFILE_LIMIT:30} {posargs}
    python -m runome.profile --janome --repeat {env:RUNOME_PROFILE_REPEAT:20} --limit {env:RUNOME_PROFILE_LIMIT:30} {posargs}
