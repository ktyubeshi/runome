name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  fast:
    name: Fast checks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Janome oracle
        run: python -m pip install janome==0.5.0
      - name: Prepare system dictionary
        run: >
          python -c "import pathlib, shutil;
          dst = pathlib.Path('sysdic');
          shutil.rmtree(dst, ignore_errors=True);
          shutil.copytree(pathlib.Path('runome') / 'sysdic', dst)"
      - name: Generate golden snapshot
        run: python tools/gen_golden.py --inputs fixtures/cases --mode full --overwrite
      - name: Generate wakati snapshot
        run: python tools/gen_golden.py --inputs fixtures/cases --mode wakati --overwrite
      - name: Assert golden snapshots are up to date
        run: git diff --exit-code golden/janome_full.jsonl
      - name: Assert wakati snapshots are up to date
        run: git diff --exit-code golden/janome_wakati.jsonl
      - name: Run golden diff tests
        run: cargo test --test test_diff_golden

  full:
    name: Full matrix (placeholder)
    needs: fast
    if: false # Enable once the golden + proptest suites are ready.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - run: echo "TODO: add long-running proptest and diff runs."
